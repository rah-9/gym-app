name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'styles.css'
      - 'index.html'
      - 'icons/**'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Android SDK licenses (SDK is preinstalled on the runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKM=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/*/bin/sdkmanager | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
      - name: Image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
      - name: Build APK
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          bash scripts/build-www.sh
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          mkdir -p ~/.android && cp signing/debug.keystore ~/.android/debug.keystore
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/gymlog.apk"
      - name: Check the APK is signed with the saved key
        run: |
          APKSIGNER=$(ls -d ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs gymlog.apk | tee certs.txt
          # SHA-256 of android-app/signing/debug.keystore. Updates only install when this never changes.
          grep -qi "SHA-256 digest: 5255621d63eb1dc6efbdf44eba51b3efb658731c2475499eb0dda9d079dbe952" certs.txt || { echo "APK is not signed with the saved key"; exit 1; }
      - name: Publish to the "android" release
        # Test builds from other branches only check that the app compiles.
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app reads this to offer "Update" (version code = build number).
          NOTES=$(git log -1 --format=%s | cut -c1-200 | jq -R .)
          printf '{"versionCode":%s,"versionName":"1.%s","notes":%s,"apk":"https://github.com/%s/releases/download/android/gymlog.apk"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$NOTES" "$GITHUB_REPOSITORY" > version.json
          cat version.json
          # A fresh release each build, so GitHub shows today's date and the version number.
          # The tag name stays "android", so the download link never changes.
          gh release delete android --yes --cleanup-tag || true
          gh release create android gymlog.apk version.json --target "$GITHUB_SHA" --latest \
            --title "FitTrack 1.$GITHUB_RUN_NUMBER" \
            --notes "$(git log -1 --format=%s). Download gymlog.apk on your phone and open it. It installs over the app you have, no need to delete it. After that the app updates itself: Today shows an Update card, or Plan > App updates."
